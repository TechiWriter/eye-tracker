<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analizador de Atención</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/gh/jspsych/jspsych@jspsych@7.0.0/examples/js/webgazer/webgazer.js"></script>
<style>
  :root{
    --white:#ffffff;
    --gray-50:#fafafa;
    --gray-100:#f5f5f4;
    --gray-200:#e7e5e2;
    --gray-300:#d4d1cc;
    --gray-400:#a8a49c;
    --gray-500:#84807a;
    --gray-800:#2b2925;
    --black:#161512;
    --ok:#3f7a52;
    --warn:#a1652e;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--white);
    color:var(--gray-800);
    font-family:var(--font-body);
    min-height:100vh;
  }

  .page{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 24px;
  }

  .header-center{
    text-align:center;
    margin-bottom:16px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    color:var(--black);
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  h1 .sparkle{ color:var(--gray-400); font-weight:400; }
  .subtitle{ color:var(--gray-400); font-size:13px; margin:4px 0 0; }

  /* Breadcrumb de pasos, chico y en una sola línea para no ocupar espacio vertical */
  .steps-path{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:8px 0 16px;
    font-size:11px;
  }
  .step{ display:flex; align-items:center; gap:5px; color:var(--gray-400); white-space:nowrap; }
  .step-num{
    font-family:var(--font-mono);
    font-size:10px;
    width:15px; height:15px;
    border-radius:50%;
    border:1px solid var(--gray-300);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step-label{ text-transform:uppercase; letter-spacing:0.04em; font-weight:500; }
  .step.active{ color:var(--black); }
  .step.active .step-num{ border-color:var(--black); background:var(--black); color:var(--white); }
  .step.done{ color:var(--gray-400); }
  .step-connector{ width:14px; height:1px; background:var(--gray-300); flex-shrink:0; }

  main{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .panel{
    background:var(--white);
    border:1px solid var(--gray-200);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }

  button{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    border:none;
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    transition:background-color .12s ease, opacity .12s ease;
  }
  button.primary{ background:var(--gray-200); color:var(--black); }
  button.primary:hover{ background:var(--gray-300); }
  button.ghost{ background:transparent; color:var(--gray-500); border:1px solid var(--gray-300);}
  button.ghost:hover{ color:var(--black); border-color:var(--gray-400); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button.small{ padding:6px 12px; font-size:12px;}
  button.link{
    background:none; border:none; padding:0;
    font-size:12px; color:var(--gray-500);
    text-decoration:underline; text-underline-offset:2px;
  }
  button.link:hover{ color:var(--black); }

  input[type=file]{ display:none; }

  /* Escenario neutro y sin bordes marcados: minimiza estímulos periféricos que sesguen la mirada */
  .stage{
    position:relative;
    background:#e9e8e5;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:380px;
  }
  .stage img{ max-width:100%; display:block; }
  .stage canvas.heat-overlay{
    position:absolute;
    top:0; left:0;
    pointer-events:none;
  }
  .stage-empty{
    color:var(--gray-400);
    font-size:13px;
    text-align:center;
    padding:20px;
  }

  .cal-dot{
    position:fixed;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--black);
    border:3px solid var(--white);
    box-shadow:0 0 0 5px rgba(0,0,0,0.08);
    cursor:pointer;
    z-index:999;
    transform:translate(-50%,-50%);
  }
  .cal-dot.clicked{ background:var(--ok); }

  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge{
    font-family:var(--font-mono);
    font-size:10.5px;
    padding:3px 9px;
    border-radius:999px;
    background:var(--gray-100);
    color:var(--gray-500);
  }
  .badge.ok{ background:rgba(63,122,82,0.12); color:var(--ok); }
  .badge.warn{ background:rgba(161,101,46,0.12); color:var(--warn); }

  .stat{ display:flex; flex-direction:column; gap:1px; }
  .stat .n{ font-size:20px; font-weight:700; color:var(--black); }
  .stat .l{ font-size:10px; color:var(--gray-400); text-transform:uppercase; letter-spacing:0.06em; }

  video#webgazerVideoFeed, canvas#webgazerFaceOverlay, canvas#webgazerFaceFeedbackBox{
    position:fixed !important;
    bottom:16px !important;
    right:16px !important;
    top:auto !important;
    left:auto !important;
    width:140px !important;
    height:104px !important;
    border-radius:8px;
    border:1px solid var(--gray-300);
    z-index:50;
  }
  #webgazerGazeDot{
    z-index:1000;
    transition: left 0.12s ease-out, top 0.12s ease-out !important;
  }

  footer{
    text-align:center;
    margin-top:20px;
    font-size:11px;
    color:var(--gray-400);
  }
  footer .dots{ display:block; letter-spacing:4px; margin-bottom:4px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="page">

<div class="header-center">
  <h1><span class="sparkle">✦</span> Analizador de Atención <span class="sparkle">✦</span></h1>
  <p class="subtitle">Sube tu contenido y descubre dónde se concentra la atención visual.</p>
</div>

<nav class="steps-path">
  <div class="step active" id="step1"><span class="step-num">1</span><span class="step-label">Cámara</span></div>
  <div class="step-connector"></div>
  <div class="step" id="step2"><span class="step-num">2</span><span class="step-label">Calibrar</span></div>
  <div class="step-connector"></div>
  <div class="step" id="step3"><span class="step-num">3</span><span class="step-label">Subir</span></div>
  <div class="step-connector"></div>
  <div class="step" id="step4"><span class="step-num">4</span><span class="step-label">Grabar</span></div>
  <div class="step-connector"></div>
  <div class="step" id="step5"><span class="step-num">5</span><span class="step-label">Heatmap</span></div>
</nav>

  <main>
    <div class="panel">
      <div class="row" style="justify-content:center;">
        <div class="row">
          <button class="primary" id="btnStart">Activar cámara</button>
          <button class="ghost" id="btnCalibrate" disabled>Calibrar</button>
          <button class="ghost" id="uploadZone">📷 Sube tu pieza</button>
          <input type="file" id="fileInput" accept="image/*">
        </div>
      </div>
      <div class="row" style="margin-top:10px; justify-content:center;">
        <span class="badge" id="camBadge">cámara: apagada</span>
        <span class="badge" id="calBadge">calibración: pendiente</span>
        <span class="badge" id="pointsBadge">0 puntos capturados</span>
      </div>
    </div>

    <div class="panel hidden" id="stagePanel">
      <div class="row" style="margin-bottom:14px; justify-content:center;">
        <button class="primary" id="btnRecord">▶ Empezar a grabar mirada</button>
        <button class="ghost" id="btnStop" disabled>■ Parar</button>
        <button class="ghost small" id="btnReset">Reiniciar puntos</button>
        <div class="row" id="statsRow" style="display:none;">
          <div class="stat"><span class="n" id="statPoints">0</span><span class="l">puntos</span></div>
          <div class="stat"><span class="n" id="statTime">0s</span><span class="l">duración</span></div>
        </div>
      </div>
      <div class="stage" id="stage">
        <img id="postImg" alt="posteo">
        <canvas class="heat-overlay" id="heatCanvas"></canvas>
      </div>
      <div class="row" style="margin-top:14px; justify-content:center;">
        <button class="ghost small" id="btnHeatmap">Generar heatmap</button>
        <button class="ghost small" id="btnExportPNG">Exportar heatmap solo (PNG)</button>
        <button class="ghost small" id="btnExportComposite">Exportar heatmap + posteo (PNG)</button>
        <button class="ghost small" id="btnExportCSV">Exportar datos CSV (x,y,t)</button>
      </div>
    </div>

  </main>

  <footer>
    <span class="dots">✦ ✦ ✦</span>
    <p>Diseñado con ♥ y un poco de vibecoding :3 ✨</p>
  </footer>

</div>

<script>
let gazeData = [];
let recording = false;
let recordStart = null;
let calibClicks = {};
const CLICKS_PER_POINT = 9;
const calibPoints = [
  [10,10],[50,10],[90,10],
  [10,50],[50,50],[90,50],
  [10,90],[50,90],[90,90]
];

const btnStart = document.getElementById('btnStart');
const btnCalibrate = document.getElementById('btnCalibrate');
const camBadge = document.getElementById('camBadge');
const calBadge = document.getElementById('calBadge');
const pointsBadge = document.getElementById('pointsBadge');
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const stagePanel = document.getElementById('stagePanel');
const postImg = document.getElementById('postImg');
const heatCanvas = document.getElementById('heatCanvas');
const btnRecord = document.getElementById('btnRecord');
const btnStop = document.getElementById('btnStop');
const btnReset = document.getElementById('btnReset');
const btnHeatmap = document.getElementById('btnHeatmap');
const btnExportPNG = document.getElementById('btnExportPNG');
const btnExportComposite = document.getElementById('btnExportComposite');
const btnExportCSV = document.getElementById('btnExportCSV');
const statsRow = document.getElementById('statsRow');
const statPoints = document.getElementById('statPoints');
const statTime = document.getElementById('statTime');

function setStep(n){
  for(let i=1;i<=5;i++){
    const el = document.getElementById('step'+i);
    el.classList.remove('active','done');
    if(i<n) el.classList.add('done');
    if(i===n) el.classList.add('active');
  }
}

// Suavizado extra por promedio móvil sobre las últimas muestras, además del filtro Kalman de WebGazer
const smoothBuffer = [];
const SMOOTH_WINDOW = 4;

function mainGazeListener(data, ts){
  if(data == null || !recording) return;
  smoothBuffer.push(data);
  if(smoothBuffer.length > SMOOTH_WINDOW) smoothBuffer.shift();
  const avgX = smoothBuffer.reduce((s,d)=>s+d.x,0) / smoothBuffer.length;
  const avgY = smoothBuffer.reduce((s,d)=>s+d.y,0) / smoothBuffer.length;

  const stageRect = document.getElementById('stage').getBoundingClientRect();
  const x = avgX - stageRect.left;
  const y = avgY - stageRect.top;
  if(x < 0 || y < 0 || x > stageRect.width || y > stageRect.height) return;
  gazeData.push({x, y, t: Date.now() - recordStart});
  statPoints.textContent = gazeData.length;
  pointsBadge.textContent = gazeData.length + ' puntos capturados';
}

btnStart.addEventListener('click', async () => {
  btnStart.disabled = true;
  btnStart.textContent = 'Iniciando...';

  if(typeof webgazer === 'undefined'){
    camBadge.textContent = 'cámara: no cargó la librería (CDN bloqueado)';
    camBadge.classList.add('warn');
    btnStart.disabled = false;
    btnStart.textContent = 'Reintentar';
    alert('La librería WebGazer no llegó a cargar desde el CDN. Puede ser un bloqueador de anuncios/rastreadores, una extensión, o tu red bloqueando cdn.jsdelivr.net. Probá desactivar extensiones o en una ventana de incógnito.');
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    camBadge.textContent = 'cámara: navegador sin soporte getUserMedia';
    camBadge.classList.add('warn');
    btnStart.disabled = false;
    btnStart.textContent = 'Reintentar';
    alert('Este navegador/contexto no soporta acceso a cámara (getUserMedia). Confirmá que la URL empiece con https:// o http://localhost.');
    return;
  }

  try{
    // Pedimos el permiso de cámara nosotros mismos primero, así el error es específico
    const testStream = await navigator.mediaDevices.getUserMedia({ video: true });
    testStream.getTracks().forEach(t => t.stop());

    await webgazer.setRegression('ridge')
      .setGazeListener(mainGazeListener)
      .begin();
    webgazer.applyKalmanFilter(true);
    webgazer.showVideoPreview(true).showPredictionPoints(true).showFaceOverlay(false).showFaceFeedbackBox(false);
    camBadge.textContent = 'cámara: activa';
    camBadge.classList.add('ok');
    btnStart.textContent = 'Cámara activa';
    btnCalibrate.disabled = false;
    setStep(2);
  }catch(e){
    console.error('Eye tracker camera error:', e);
    let msg = 'No se pudo acceder a la cámara: ' + (e.name || 'error desconocido') + '.';
    if(e.name === 'NotAllowedError') msg += ' El sitio no tiene permiso — revisá el ícono de cámara junto a la URL y ponelo en Permitir.';
    else if(e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') msg += ' No se detectó ninguna cámara conectada.';
    else if(e.name === 'NotReadableError' || e.name === 'TrackStartError') msg += ' La cámara está siendo usada por otra app (Zoom, Meet, OBS, otra pestaña, etc). Cerrala e intentá de nuevo.';
    else if(e.name === 'OverconstrainedError') msg += ' La cámara no soporta la configuración pedida.';
    else msg += ' Revisá la consola (F12) para más detalle.';
    camBadge.textContent = 'cámara: ' + (e.name || 'error');
    camBadge.classList.add('warn');
    btnStart.disabled = false;
    btnStart.textContent = 'Reintentar';
    alert(msg);
  }
});

btnCalibrate.addEventListener('click', () => runCalibration());

function runCalibration(){
  calBadge.classList.remove('ok','warn');
  calibClicks = {};
  document.querySelectorAll('.cal-dot').forEach(d => d.remove());
  calibPoints.forEach((p, idx) => {
    const dot = document.createElement('div');
    dot.className = 'cal-dot';
    dot.style.left = p[0] + 'vw';
    dot.style.top = p[1] + 'vh';
    dot.dataset.idx = idx;
    dot.addEventListener('click', () => {
      dot.classList.add('clicked');
      calibClicks[idx] = (calibClicks[idx] || 0) + 1;
      if(calibClicks[idx] >= CLICKS_PER_POINT){
        dot.style.pointerEvents = 'none';
      }
      const totalDone = Object.values(calibClicks).filter(c => c >= CLICKS_PER_POINT).length;
      calBadge.textContent = 'calibración: ' + totalDone + '/9 puntos (' + CLICKS_PER_POINT + ' clicks c/u)';
      if(totalDone >= 9){
        setTimeout(() => {
          document.querySelectorAll('.cal-dot').forEach(d => d.remove());
          runValidation();
        }, 400);
      }
    });
    document.body.appendChild(dot);
  });
}

// Puntos distintos a los de calibración, para chequear precisión real sin hacer trampa
const validationPoints = [[25,25],[75,25],[50,50],[25,75],[75,75]];

function runValidation(){
  calBadge.textContent = 'validando precisión...';
  let vIdx = 0;
  const errors = [];
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:998;background:rgba(20,20,20,0.4);';
  document.body.appendChild(overlay);

  function nextPoint(){
    if(vIdx >= validationPoints.length){
      overlay.remove();
      finishValidation(errors);
      return;
    }
    const p = validationPoints[vIdx];
    const dot = document.createElement('div');
    dot.className = 'cal-dot';
    dot.style.left = p[0] + 'vw';
    dot.style.top = p[1] + 'vh';
    dot.style.background = 'var(--gray-400)';
    dot.style.pointerEvents = 'none';
    document.body.appendChild(dot);
    const targetX = (p[0]/100) * window.innerWidth;
    const targetY = (p[1]/100) * window.innerHeight;

    const samples = [];
    const collectFrom = Date.now() + 500; // ignora los primeros 500ms mientras el usuario fija la mirada
    webgazer.setGazeListener((data) => {
      if(data == null || Date.now() < collectFrom) return;
      samples.push(data);
    });

    setTimeout(() => {
      if(samples.length){
        const avgX = samples.reduce((s,d)=>s+d.x,0)/samples.length;
        const avgY = samples.reduce((s,d)=>s+d.y,0)/samples.length;
        const dist = Math.hypot(avgX-targetX, avgY-targetY);
        errors.push(dist);
      }
      webgazer.setGazeListener(mainGazeListener);
      dot.remove();
      vIdx++;
      nextPoint();
    }, 1400);
  }
  nextPoint();
}

function finishValidation(errors){
  btnCalibrate.textContent = 'Recalibrar (9 puntos)';
  const diag = Math.hypot(window.innerWidth, window.innerHeight);
  const avgErrorPx = errors.length ? errors.reduce((a,b)=>a+b,0)/errors.length : diag;
  const errorPct = avgErrorPx / diag * 100;
  const score = Math.max(0, Math.round(100 - errorPct*2.2));

  if(score >= 60){
    calBadge.textContent = 'calibración: buena (precisión ' + score + '%)';
    calBadge.classList.add('ok');
    setStep(3);
  } else {
    calBadge.textContent = 'calibración: floja (precisión ' + score + '%)';
    calBadge.classList.add('warn');
    const retry = confirm(
      'La precisión salió baja (' + score + '%). Esto suele pasar por poca luz, mucho movimiento de cabeza, o quedar muy lejos/cerca de la cámara.\n\n' +
      '¿Querés recalibrar ahora? (Aceptar = recalibrar, Cancelar = seguir igual)'
    );
    if(retry){ runCalibration(); } else { setStep(3); }
  }
}

uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    postImg.src = ev.target.result;
    postImg.onload = () => {
      stagePanel.classList.remove('hidden');
      heatCanvas.width = postImg.clientWidth;
      heatCanvas.height = postImg.clientHeight;
      setStep(4);
    };
  };
  reader.readAsDataURL(file);
});

btnRecord.addEventListener('click', () => {
  gazeData = [];
  recording = true;
  recordStart = Date.now();
  statsRow.style.display = 'flex';
  btnRecord.disabled = true;
  btnStop.disabled = false;
  document.querySelector('.steps-path').style.visibility = 'hidden';
  document.querySelector('.header-center').style.visibility = 'hidden';
  tickTimer();
});

function tickTimer(){
  if(!recording) return;
  statTime.textContent = Math.round((Date.now()-recordStart)/1000) + 's';
  requestAnimationFrame(tickTimer);
}

btnStop.addEventListener('click', () => {
  recording = false;
  btnRecord.disabled = false;
  btnStop.disabled = true;
  document.querySelector('.steps-path').style.visibility = 'visible';
  document.querySelector('.header-center').style.visibility = 'visible';
  setStep(5);
});

btnReset.addEventListener('click', () => {
  gazeData = [];
  statPoints.textContent = '0';
  pointsBadge.textContent = '0 puntos capturados';
  const ctx = heatCanvas.getContext('2d');
  ctx.clearRect(0,0,heatCanvas.width, heatCanvas.height);
});

btnHeatmap.addEventListener('click', () => drawHeatmap());

function drawHeatmap(){
  heatCanvas.width = postImg.clientWidth;
  heatCanvas.height = postImg.clientHeight;
  const ctx = heatCanvas.getContext('2d');
  ctx.clearRect(0,0,heatCanvas.width, heatCanvas.height);
  if(gazeData.length === 0){ alert('Todavía no hay datos de mirada grabados.'); return; }

  const radius = 46;
  gazeData.forEach(p => {
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
    grad.addColorStop(0, 'rgba(139,92,246,0.35)');
    grad.addColorStop(1, 'rgba(139,92,246,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
    ctx.fill();
  });

  // recolor con la escala clásica de heatmap: verde (baja densidad) -> amarillo -> rojo (alta densidad)
  const img = ctx.getImageData(0,0,heatCanvas.width, heatCanvas.height);
  for(let i=0;i<img.data.length;i+=4){
    const a = img.data[i+3];
    if(a === 0) continue;
    const t = Math.min(a/255, 1);
    let r, g, b;
    if(t < 0.5){
      // verde -> amarillo
      const k = t / 0.5;
      r = Math.round(40 + k*(255-40));
      g = Math.round(180 + k*(220-180));
      b = 40;
    } else {
      // amarillo -> rojo
      const k = (t - 0.5) / 0.5;
      r = 255;
      g = Math.round(220 - k*220);
      b = 40 - Math.round(k*40);
    }
    img.data[i] = r; img.data[i+1] = g; img.data[i+2] = Math.max(b,0);
    img.data[i+3] = Math.min(255, a*1.8);
  }
  ctx.putImageData(img, 0, 0);
}

btnExportPNG.addEventListener('click', () => {
  if(heatCanvas.width === 0){ alert('Generá el heatmap primero.'); return; }
  const link = document.createElement('a');
  link.download = 'heatmap-solo.png';
  link.href = heatCanvas.toDataURL('image/png');
  link.click();
});

btnExportComposite.addEventListener('click', () => {
  if(heatCanvas.width === 0){ alert('Generá el heatmap primero.'); return; }
  const nw = postImg.naturalWidth, nh = postImg.naturalHeight;
  const composite = document.createElement('canvas');
  composite.width = nw;
  composite.height = nh;
  const cctx = composite.getContext('2d');
  cctx.drawImage(postImg, 0, 0, nw, nh);
  cctx.drawImage(heatCanvas, 0, 0, nw, nh); // escala del tamaño mostrado al tamaño natural
  const link = document.createElement('a');
  link.download = 'heatmap-sobre-posteo.png';
  link.href = composite.toDataURL('image/png');
  link.click();
});

btnExportCSV.addEventListener('click', () => {
  if(gazeData.length === 0){ alert('Todavía no hay datos grabados.'); return; }
  let csv = 'x_px,y_px,t_ms\n';
  gazeData.forEach(p => { csv += `${p.x.toFixed(1)},${p.y.toFixed(1)},${p.t}\n`; });
  const blob = new Blob([csv], {type:'text/csv'});
  const link = document.createElement('a');
  link.download = 'gaze-data.csv';
  link.href = URL.createObjectURL(blob);
  link.click();
});

window.addEventListener('beforeunload', () => {
  if(window.webgazer) webgazer.end();
});
